name: OpenVR branch build

on:
  push:
    branches:
      - feat/20261115-openvr-runtime
  workflow_dispatch:

concurrency:
  group: openvr-branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Meson
        run: pip install meson==1.1.0

      - name: Configure debugoptimized
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          . .\build_common.ps1
          PerformBuild -BuildFlavour debugoptimized -BuildSubDir _Comp64DebugOptimized -Backend ninja -EnableTracy false -ConfigureOnly $true

      - name: Compile (limited parallelism)
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          Push-Location _Comp64DebugOptimized
          try {
            meson compile -v -j 2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Install build outputs
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          . .\build_common.ps1
          SetupBuild -BuildArch x64
          Push-Location _Comp64DebugOptimized
          try {
            meson install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: openvr-build-diagnostics-${{ github.sha }}
          path: |
            _Comp64DebugOptimized\meson-logs\meson-log.txt
            _Comp64DebugOptimized\meson-logs\*.txt
            _Comp64DebugOptimized\meson-private\cmd_line.txt
            _Comp64DebugOptimized\.ninja_log
            _Comp64DebugOptimized\build.ninja
            _Comp64DebugOptimized\update-deps.log
            update-deps.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows build
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: openvr-dxvk-remix-debugoptimized-${{ github.sha }}
          path: |
            _output\*.dll
            _output\*.pdb
            _output\*.txt
            _output\LICENSE
            _output\LICENSE-MIT
            _output\CREDITS.md
            _output\usd\*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
